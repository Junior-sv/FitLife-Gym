<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - FitLife Fitness Gym</title>
    <link rel="stylesheet" href="css/style.css"
</head>

<body>

    <!-- Header Section -->
    <header>
        <h1>FitLife Fitness Gym</h1>
        <p>Stronger Every Day.</p>
    </header>

    <!-- Navigation Menu -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- Main Content -->
     <main>

        <section>
            <h2>Make an Enquiry</h2>

            <p>
                Have a question about our gym or services?
                Complete the form below and we will get back to you.
            </p>

        <form>
        
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone"><br><br>

            <label for="service">Service:</label><br>
            <select id="service" name="service">
                <option value="personal-training">Personal Training</option>
                <option value="group-classes">Group Fitness Classes</option>
                <option value="gym-equipment">Gym Equipment</option>
            </select><br><br>

            <label for="message">Your Enquiry</label><br>
            <textarea id="message" name="message" rows="5" required></textarea><br>

            <button type="submit">Submit Enquiry</button>

         </form>

       <section>

    </main>

    <!-- Footer -->
      <footer>
        <p>&copy; 2026 FitLife Fitness Gym. All rights reserved.</p>
      </footer>

</body>

</html>
